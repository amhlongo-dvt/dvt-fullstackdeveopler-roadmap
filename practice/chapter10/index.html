<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body class="l-page">
        <main>
            <h1>Franklin Running Club</h1>
            <div class="race-grid">
                <div class="race-detail">
                    <img src="race.jpg" alt="">
                    <div class="race-detail__body">
                        <h3>Union County 10k</h3>
                        <p class="race-detail__date">
                            Saturday, April 14
                        </p>
                    </div>
                </div>
                <div class="race-detail">
                    <img src="shoe.jpg" alt="">
                    <div class="race-detail__body">
                        <h3>Patrick's Day 10k</h3>
                        <p class="race-detail__date">
                            Saturday, March 17
                        </p>
                    </div>
                </div>
                <div class="race-detail">
                    <img src="runner-hill.jpg" alt="">
                    <div class="race-detail__body">
                        <h3>Mile Uphill</h3>
                        <p class="race-detail__date">
                            Thursday, March 29
                        </p>
                    </div>
                </div>
            </div>
        </main>

        <aside>
            <h3>Running tips</h3>
            <div class="media">
                <img class="media__image" src="runner.png"  alt="">
                <div class="media__body">
                    <h4>Change it up</h4>
                    <p>
                        Dont run the same every day. 
                        Vary your pace, and vary the distance of your runs.
                    </p>    
                </div>
            </div>
            <div class="race-detail">
                    <img src="race.jpg" alt="">
                    <div class="race-detail__body">
                        <h3>Union County 10k</h3>
                        <p class="race-detail__date">
                            Saturday, April 14
                        </p>
                    </div>
                </div>
        </aside>
        <footer>
            <button id="light-theme">Light Mode</button>
            <button id="dark-theme">Dark Mode</button>
        </footer>
        <script>
            const lightThemeButton = document.getElementById('light-theme');
            const darkThemeButton = document.getElementById('dark-theme');

            lightThemeButton.addEventListener('click', () => {
                document.documentElement.setAttribute('data-theme', 'light');
            });

            darkThemeButton.addEventListener('click', () => {
                document.documentElement.setAttribute('data-theme', 'dark');
            });
        </script>
    </body>
</html>
